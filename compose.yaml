name: caregap

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caregap}
      POSTGRES_USER: ${POSTGRES_USER:-caregap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - caregap_pgdata:/var/lib/postgresql/data
      - ./infra/postgis-init.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caregap} -d ${POSTGRES_DB:-caregap}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      CAREGAP_ENV: development
      CAREGAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-caregap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-caregap}
      CAREGAP_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CAREGAP_LOG_LEVEL: INFO
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  caregap_pgdata:
